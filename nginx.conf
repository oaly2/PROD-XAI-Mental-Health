events {}

http {
   server {
     listen 80;
     listen [::]:80;
   
     server_name mental-health.erklaerbare-ki.de www.mental-health.erklaerbare-ki.de;
     server_tokens off;
   
   
     location /.well-known/acme-challenge/ {
       root /var/www/certbot;
     }
   
     location / {
       return 301 https://mental-health.erklaerbare-ki.de$request_uri;
     }
   }
   
   server {
      listen 443 default_server ssl;
      listen [::]:443 ssl;
    
      server_name www.mental-health.erklaerbare-ki.de;
   
      
      ssl_certificate /cert/fullchain1.pem;
      ssl_certificate_key /cert/privkey1.pem;
    
    
      location / {
         proxy_pass http://frontend:80;
      }
  
      location /api {
         rewrite ^/api(.*) $1 break;
         proxy_pass http://backend:8080;
      }
           
    }
 }
